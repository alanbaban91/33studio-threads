name: Refresh Threads + Instagram tokens (33Studio)

on:
  schedule:
    - cron: "0 6 1,15 * *"   # 1st and 15th of each month (tokens last 60 days)
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token and save it back to repo secrets
        env:
          OLD_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -sf "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=${OLD_TOKEN}" | jq -r .access_token)
          if [ -z "$NEW" ] || [ "$NEW" = "null" ]; then
            echo "Token refresh failed. Run get_token.py again and update THREADS_TOKEN."
            exit 1
          fi
          echo "::add-mask::$NEW"
          gh secret set THREADS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
          echo "Token refreshed."

      - name: Refresh Instagram token (skipped until IG_TOKEN is set)
        env:
          OLD_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [ -z "$OLD_TOKEN" ] && { echo "No IG_TOKEN yet."; exit 0; }
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${OLD_TOKEN}" | jq -r .access_token)
          if [ -z "$NEW" ] || [ "$NEW" = "null" ]; then
            echo "Instagram token refresh failed. Generate a new one and update IG_TOKEN."
            exit 1
          fi
          echo "::add-mask::$NEW"
          gh secret set IG_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
          echo "Instagram token refreshed."
