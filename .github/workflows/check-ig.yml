name: Check Instagram token (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect token shape (prints only 4 characters)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          T="$IG_TOKEN"
          echo "starts=${T:0:4} length=${#T}"
          case "$T" in *" "*) echo "contains a space";; esac
          [ "$T" != "$(printf '%s' "$T" | tr -d '\n\r')" ] && echo "contains a line break"
          echo "facebook graph says:"; curl -s "https://graph.facebook.com/me?access_token=${T}" | head -c 200; echo
