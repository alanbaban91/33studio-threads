name: Save post stats (Control House)

on:
  schedule:
    - cron: "45 */6 * * *"   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read views, likes and replies
        run: python3 stats.py
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Save stats.json
        run: |
          git config user.name "control-house"
          git config user.email "control-house@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Saved post stats"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
